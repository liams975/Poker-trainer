name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The engine's portability to a React Native runtime (docs/01-architecture.md)
      # rests on it having no runtime dependencies at all. Assert it, don't assume it.
      - name: engine has zero runtime dependencies
        run: |
          node -e "
            const p = require('./packages/engine/package.json');
            const deps = Object.keys(p.dependencies ?? {});
            if (deps.length) {
              console.error('packages/engine must have no runtime dependencies, found: ' + deps.join(', '));
              process.exit(1);
            }
          "

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # docs/02-roadmap.md Phase 1 exit criterion: "Fast and naive evaluators
      # agree on 1M random 7-card hands." `pnpm test` runs a smaller sample so
      # the local loop stays fast; the full million runs here, on every push.
      - name: evaluator oracle, full sample
        run: pnpm test:engine:exhaustive

      - run: pnpm build

  database:
    name: migrations · RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned, not `latest`. An upstream CLI release turning this job red with
      # no change in the repo is a bad way to find out about a breaking change
      # in `supabase start` or `db reset`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # docs/01-architecture.md ranks RLS gaps as the #1 attack surface and
      # asks that policies be tested "as part of the suite, not by eyeballing
      # them". This job is what makes that true on every push rather than once
      # on somebody's laptop.
      - name: start local stack
        run: supabase start

      # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY,
      # so the names are mapped explicitly rather than blanket-prefixed. These
      # are throwaway keys for a container that dies with the job.
      - name: export stack credentials
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Proves migrations apply from nothing, then seeds content through the
      # same script a human would run.
      - name: reset and seed
        run: pnpm db:reset

      - name: pgTAP policy suite
        run: pnpm db:test

      - name: RLS through the client library
        run: pnpm test:db

  # The Phase 5 exit criterion, on every push: sign up, land on the dashboard,
  # sign out. Needs the stack, so it cannot live in the hermetic `verify` job.
  # Separate from `database` because a red e2e run and a red policy run mean
  # very different things and shouldn't hide each other.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: start local stack
        run: supabase start

      - name: export stack credentials
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: reset and seed
        run: pnpm db:reset

      - name: install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: end-to-end suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
